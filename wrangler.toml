# Cloudflare Pages configuration for Sephiria Wiki (https://sephiria.cfd).
#
# ⚠️ When this file exists, it is the SOLE source of truth for the Pages
# project's env — the Cloudflare dashboard's "Environment variables" UI is
# completely IGNORED. Change values here, not in the dashboard.
#
# Usage:
#   pnpm build
#   npx wrangler pages dev dist
#
# This file is optional — Cloudflare Pages auto-detects Astro when you
# connect your GitHub repo via the dashboard. Use this only for local
# preview or `wrangler pages deploy`.
#
# Reference: https://developers.cloudflare.com/pages/functions/wrangler-configuration/

name = "sephiriawiki-5ro"
compatibility_date = "2026-08-11"
pages_build_output_dir = "dist"

[vars]
# Node version for the Cloudflare Pages build image (matches .nvmrc / engines).
NODE_VERSION = "22"
# Site (must include https:// protocol — Astro validates this as a URL)
SITE_URL = "https://sephiria.cfd"
# Giscus comments (empty = disabled, Comments.astro returns null — preserves
# Lighthouse 4×100). To enable: fill in your own repo's values from
# https://giscus.app. See docs/comments.md.
PUBLIC_GISCUS_REPO = ""
PUBLIC_GISCUS_REPO_ID = ""
PUBLIC_GISCUS_CATEGORY = ""
PUBLIC_GISCUS_CATEGORY_ID = ""
PUBLIC_GISCUS_MAPPING = "pathname"
# Adsterra ad slots (empty = disabled, ad components render nothing and
# inject-ad-keys.ts leaves dist/ads/*.html untouched). Fill each with the key
# from the matching ad unit at https://publishers.adsterra.com/. See
# docs/ads.md — keys map 1:1 to public/ads/*.html slot files.
PUBLIC_AD_MOBILE_320X50 = "63820e5cd3cc55129e60054bb3389641"
PUBLIC_AD_SIDEBAR_160X300 = "91d95bf32145701591d6a883d7f15fb9"
PUBLIC_AD_SIDEBAR_160X600 = "3d3f893bb06a60156d102b0cebb62f62"
PUBLIC_AD_BANNER_728X90 = "0d4d96090435e51386627768a51662d3"
PUBLIC_AD_BANNER_300X250 = "86b54708f88a87fb600e478d3e6a5f8e"
PUBLIC_AD_BANNER_468X60 = "dc3c7aeccd88cf6a0405f9bda864107d"
